<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#040a1c" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>響</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23061233'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%237cc4ff'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%237cc4ff' stroke-opacity='.6' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%237cc4ff' stroke-opacity='.25' stroke-width='1.5'/%3E%3C/svg%3E" />
  </head>
  <body>
    <canvas id="water" aria-label="水面"></canvas>
    <div id="aura" aria-hidden="true">
      <b class="glow g1"></b><b class="glow g2"></b><b class="glow g3"></b>
      <i style="--x:45%;--y:25%;--s:5.6px;--o:0.74;--dx:-25px;--dy:-26px;--d:12s;--l:-11s"></i>
      <i class="soft" style="--x:78%;--y:13%;--s:16px;--o:0.4;--dx:-23px;--dy:-33px;--d:17s;--l:-2s"></i>
      <i style="--x:34%;--y:17%;--s:7.0px;--o:0.63;--dx:-19px;--dy:-46px;--d:11s;--l:-18s"></i>
      <i style="--x:78%;--y:56%;--s:4.2px;--o:0.8;--dx:-29px;--dy:-25px;--d:13s;--l:-9s"></i>
      <i style="--x:57%;--y:24%;--s:7.0px;--o:0.51;--dx:5px;--dy:-25px;--d:13s;--l:-3s"></i>
      <i style="--x:78%;--y:79%;--s:4.2px;--o:0.61;--dx:-26px;--dy:-24px;--d:11s;--l:-6s"></i>
      <i class="soft" style="--x:67%;--y:74%;--s:16px;--o:0.45;--dx:25px;--dy:-23px;--d:18s;--l:-11s"></i>
      <i style="--x:42%;--y:37%;--s:4.2px;--o:0.76;--dx:-3px;--dy:-55px;--d:15s;--l:-16s"></i>
      <i style="--x:67%;--y:49%;--s:5.6px;--o:0.57;--dx:-25px;--dy:-53px;--d:19s;--l:-13s"></i>
      <i style="--x:25%;--y:49%;--s:4.2px;--o:0.8;--dx:19px;--dy:-58px;--d:12s;--l:-17s"></i>
      <i style="--x:77%;--y:46%;--s:5.6px;--o:0.76;--dx:29px;--dy:-23px;--d:18s;--l:-2s"></i>
      <i class="soft" style="--x:15%;--y:40%;--s:16px;--o:0.45;--dx:-26px;--dy:-57px;--d:15s;--l:-18s"></i>
      <i style="--x:91%;--y:63%;--s:5.6px;--o:0.76;--dx:10px;--dy:-59px;--d:18s;--l:-11s"></i>
      <i style="--x:25%;--y:84%;--s:4.2px;--o:0.67;--dx:-7px;--dy:-42px;--d:13s;--l:-7s"></i>
    </div>
    <div id="ghost-dot" aria-hidden="true"></div>

    <h1 id="wordmark" role="button" tabindex="0" aria-label="手紙を渡す">響</h1>
    <p id="hint" aria-live="polite">触れてみてください</p>

    <nav id="bar" aria-label="コントロール">
      <div class="seg" role="radiogroup" aria-label="ムード">
        <span class="ind" aria-hidden="true"></span>
        <button id="mood-calm" class="mood" role="radio" data-mood="calm" aria-checked="true" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9.5c2.2-2.2 4.4-2.2 6.5 0s4.3 2.2 6.5 0 4.3-2.2 5-1.5"/><path d="M3 15.5c2.2-2.2 4.4-2.2 6.5 0s4.3 2.2 6.5 0 4.3-2.2 5-1.5"/></svg>
          <span>凪</span>
        </button>
        <button id="mood-night" class="mood" role="radio" data-mood="night" aria-checked="false" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.6A8 8 0 1 1 9.4 4a6.4 6.4 0 0 0 10.6 10.6z"/></svg>
          <span>夜</span>
        </button>
        <button id="mood-dawn" class="mood" role="radio" data-mood="dawn" aria-checked="false" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18.5h18"/><path d="M7 18.5a5 5 0 0 1 10 0"/><path d="M12 6.5v2.2"/><path d="M5 10.6l1.6 1.5"/><path d="M19 10.6l-1.6 1.5"/></svg>
          <span>暁</span>
        </button>
      </div>
      <span class="sep" aria-hidden="true"></span>
      <button id="mute" type="button" aria-pressed="false" aria-label="ミュート">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9.7v4.6h3.4l4.3 3.7V6L7.4 9.7z"/>
          <g class="on"><path d="M15.4 9.2a4 4 0 0 1 0 5.6"/><path d="M18 6.6a7.6 7.6 0 0 1 0 10.8"/></g>
          <g class="off"><path d="M15.5 9.5l5 5"/><path d="M20.5 9.5l-5 5"/></g>
        </svg>
      </button>
    </nav>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
