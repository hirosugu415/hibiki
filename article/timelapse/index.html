を保つ、または門幅を広げる）。\n3. gate-off 撮影の eval を dataset.gate 不在でも落ちないように直す。","videos":[],"screens":[{"name":"home","viewport":"desktop","blank":false,"src":"img/c082-desktop-home.jpg"},{"name":"touched","viewport":"desktop","blank":false,"src":"img/c082-desktop-touched.jpg"},{"name":"home","viewport":"mobile","blank":false,"src":"img/c082-mobile-home.jpg"},{"name":"touched","viewport":"mobile","blank":false,"src":"img/c082-mobile-touched.jpg"}]},{"n":83,"pad":"083","mode":"normal","healthy":true,"reasons":[],"errors":[],"score":7,"direction":"polish","summary":"mobile homeの継ぎ目は解消し静かになったが、潮の門の半円は読めず「欠けた輪」止まり","logline":"mode=normal | score 7/10 | health=ok | polish | mobile homeの継ぎ目は解消し静かになったが、潮の門の半円は読めず「欠けた輪」止まり","notes":[],"feedback":"# FEEDBACK v83\n## VISION 適合\n適合。desktop-home / mobile-home とも「触れてみてください」・石・下部ピルのみで静か。ヘルスOK、コンソールエラー0。1タップで輪が出る構造も不変。\n## 採点の根拠\n- 良い: 要求1は達成。mobile-home の y≈400 にあった水平の継ぎ目は消え、desktop-home とも帯・筋なし。gate-off（mobile）は home と同じ静かな画面で回帰なし。springs-two も荒れなし。\n- 悪い: 要求2は未達。mobile-gate-split-early は堤で括れた「くらげ型の1つの輪」で、門の下に半円は見えない（下は石と空の水面だけ）。mobile-gate-split（後）はほぼ何も残っていない。desktop-gate-split は上に大きな弧、下は歪んだ淡い弧。REPORT の「mobile で半円が確認できた」は過大。\n- 悪い: desktop-gate-split-early は堤の影響が見えない普通の同心円で、門の効果が静止画で伝わらない。\n- 撮影: gate-off の eval 修正は有効（警告なし）。\n- 潮の門は3サイクル投じても「静止画1枚で別物と読める」基準に達していない。8へ戻れないのはこの機能が価値になっていないため。ORDER の撤退条件に該当。\n## 動作確認で分かったこと\nスクショのみで判定（home・gate-split・gate-off・springs-two の desktop/mobile）。home の継ぎ目消去以外に新たな体験の改善は無い。\n## 方向性の判断\npolish。方向転換するほどの崩れは無い。門は既定 off（opt-in）へ退かせ、次は発想サイクルで新しい軸を探す。\n## 次に最も効くこと\n1. 潮の門を既定 off に戻す（`?gate=1` で opt-in、コードは残す）。\n2. 発想サイクルで、静止画1枚で「別物」と読める体験案を出す。\n3. 既存の複数機能（雨・空・泉・bowl等）の既定表示がホームで騒がしくならないよう保つ。","videos":[],"screens":[{"name":"home","viewport":"desktop","blank":false,"src":"img/c083-desktop-home.jpg"},{"name":"touched","viewport":"desktop","blank":false,"src":"img/c083-desktop-touched.jpg"},{"name":"home","viewport":"mobile","blank":false,"src":"img/c083-mobile-home.jpg"},{"name":"touched","viewport":"mobile","blank":false,"src":"img/c083-mobile-touched.jpg"}]},{"n":84,"pad":"084","mode":"innovation","healthy":true,"reasons":[],"errors":[],"score":7,"direction":"polish","summary":"潮の門を既定offに退却、homeは静かで回帰なし。発想サイクルでapp実質無変更、7点据え置き","logline":"mode=innovation | score 7/10 | health=ok | polish | 潮の門を既定offに退却、homeは静かで回帰なし。発想サイクルでapp実質無変更、7点据え置き","notes":[],"feedback":"# FEEDBACK v84\n## VISION 適合（絶対のルールを守れているか）\n適合。desktop-home / mobile-home とも、石・ワードマーク・短い一言「触れてみてください」・ガラスのバーだけで余白が整い、空っぽに見えない。mobile-touched では1タップで淡い輪が広がり、タップ領域・バーはスマホ幅で崩れなし。ヘルスOK、コンソールエラー0。\n## 採点の根拠\n- 良い点: mobile-gate-off は継ぎ目・暗い堤の帯が消え、c83 で指摘した「欠けた輪」も出ない。desktop-touched の輪は繊細で白飛びなし。mobile-springs-two の節線の縞（双つの泉）は依然としてこのアプリ最良の一枚で、静止画1枚で別物と読める。\n- 悪い点: 今回の差分は main.js 1行のみで、体験は c80 時点（8点）に戻っただけ。ホームは「静かで綺麗」だが、触る前の3秒は石と星屑だけで、記憶に残る絵ではない。mobile の下半分は相変わらず余白が多い。\n- REPORT との照合: 「gate off は従来の ?gate=0 と同経路」は home / gate-off のスクショと一致。スクショ目視比較をしていない点は、1行変更なので許容。\n- 点数: 退却で壊れてはいないが、改善の証拠もない。8に戻す根拠が無いので7据え置き。\n## 動作確認で分かったこと\nprobe は使わず（app 実質無変更、報告の dataset.gate off/on はスクショと整合）。gate-split は `gate=1` 付きの独立撮影のまま残っており、既定には影響しない。\n## 方向性の判断\npolish。伸びも落ちもしていない。潮の門のような「低コントラストの物理効果が静止画で読めない」失敗を避け、輪郭がはっきり描ける要素で次の差を作る。\n## 次に最も効くこと\n1. 静止画1枚で白黒がつく、演奏から生まれる絵（巻貝）の導入。\n2. 再訪の動機（水底に過去の貝殻が沈む）。\n3. ホームの下半分の静けさは保つ（賑やかにしない）。","videos":[],"screens":[{"name":"home","viewport":"desktop","blank":false,"src":"img/c084-desktop-home.jpg"},{"name":"touched","viewport":"desktop","blank":false,"src":"img/c084-desktop-touched.jpg"},{"name":"home","viewport":"mobile","blank":false,"src":"img/c084-mobile-home.jpg"},{"name":"touched","viewport":"mobile","blank":false,"src":"img/c084-mobile-touched.jpg"}]},{"n":85,"pad":"085","mode":"normal","healthy":true,"reasons":[],"errors":[],"score":7,"direction":"polish","summary":"巻貝は部屋の分割まで読め自然発火も動く。線画寄りで石と重なり、水底はやや図鑑的","logline":"mode=normal | score 7/10 | health=ok | polish | 巻貝は部屋の分割まで読め自然発火も動く。線画寄りで石と重なり、水底はやや図鑑的","notes":[],"feedback":"# FEEDBACK v85\n## VISION 適合（絶対のルールを守れているか）\n守れている。desktop-home / mobile-home は c84 と同一の静かなホーム（「触れてみてください」＋石）で、3秒体験に変化なし。コンソールエラー0、ヘルスOK。貝殻は演奏後にしか出ず、新しい UI・文字は増えていない。\n## 採点の根拠\n- 良い点: desktop-shell-show / mobile-shell-show で、対数螺旋の外殻・隔壁・巻きの中心が静止画1枚で読める。潮の門が3サイクル読めなかったのと対照的に「何の絵か」が一目で分かる。desktop-shells-floor は形の違う5個が下半分に散り、再訪の楽しみになる。\n- 実プレイ確認: 非デモで9打→約11秒放置 → probe `desktop-nat-a` で貝殻が中央に自然発火、dataset.shell=\"9,2.5\"、localStorage `hibiki.shells` に x,y,打配列が保存された。REPORT が未確認とした経路は動いている。\n- 悪い点: (1) 輪郭が均一な白い線の「技術図面」風で、Apple 的な質感（真珠層・ガラスの厚み）が弱い。部屋の塗りもほぼ平板。(2) shell-show は石の影が殻の下に透けて重なり、mobile では上端が石に触れ、バー前の構図が濁る。(3) 水底の5個は大きさ・巻き数が近く、輪郭が明るくてホームの「静けさ」より図鑑風に見える。波紋と同輝度で競合している（shells-floor）。(4) 自然発火時、貝殻が浮かぶ間に波紋の残像リングと重なり騒がしい（nat-a）。\n- REPORT との照合: 主張はおおむね一致。PNG保存は省略（妥当）。\n## 動作確認で分かったこと\nprobe で `?seed=1&hour=13` に9回タップ→11.5秒待機：貝殻出現、保存成功、コンソールエラー0。\n## 方向性の判断\npolish。貝殻という核は成立した。次は「線画」から「真珠層のガラス質」へ質感を上げ、石との重なりと水底の図鑑感を解消する。7を超えるには見た目の洗練が要る。\n## 次に最も効くこと\n1. 貝殻の質感（部屋ごとの淡い真珠色グラデ塗り、外縁の厚みと内側ハイライト、隔壁は細く）。\n2. 構図: 石と重ならない位置・自然発火時は残像を抑える。\n3. 水底の貝殻の多様性（大きさ・向き・巻き数）と減光。","videos":[],"screens":[{"name":"home","viewport":"desktop","blank":false,"src":"img/c085-desktop-home.jpg"},{"name":"touched","viewport":"desktop","blank":false,"src":"img/c085-desktop-touched.jpg"},{"name":"home","viewport":"mobile","blank":false,"src":"img/c085-mobile-home.jpg"},{"name":"touched","viewport":"mobile","blank":false,"src":"img/c085-mobile-touched.jpg"}]},{"n":86,"pad":"086","mode":"normal","healthy":true,"reasons":[],"errors":[],"score":7,"direction":"polish","summary":"巻貝が真珠層のガラス質になり石と離れて静かに。水底も大小で多様に。7点据え置き","logline":"mode=normal | score 7/10 | health=ok | polish | 巻貝が真珠層のガラス質になり石と離れて静かに。水底も大小で多様に。7点据え置き","notes":[],"feedback":"# FEEDBACK v86\n## VISION 適合（絶対のルールを守れているか）\n守れている。desktop-home / mobile-home は c85 と同じ静かなホーム（「触れてみてください」＋石＋下部バー）で、3秒体験に変化なし。ヘルスOK、コンソールエラー0。新しい常設UI・文字は増えていない。\n## 採点の根拠\n- 良い点: desktop-shell-show は外縁が太く、部屋ごとに淡い濃淡があり、c85 の「白線の図面」よりガラス・真珠層の厚みが出た。隔壁は細く低コントラストで、部屋の分割は読める。mobile-shell-show は殻が上方に収まり、石との間に大きな隙間があって影の透けも消えた（c85 の最大の濁りが解消）。mobile-shells-floor / desktop-shells-floor は5個の大きさ・向き・巻き数がはっきり違い、輝度も下がって波紋より控えめ。ホームの静けさを壊さない。\n- 悪い点: (1) 殻はまだ「輪郭＋淡い塗り」で、Apple 的な立体感（内部の奥行き、真珠の虹色の揺らぎ）までは届かない。色相差も静止画ではほぼ見えない。(2) 殻は見るだけの存在で、触っても何も起きない。VISION の「演奏の記録」という軸の核なのに、記録に戻る手段がない。(3) desktop-shells-floor は波紋リングと殻が混在し、左上のリングがワードマークに被っている（デモ撮影の副産物だが騒がしい）。\n- REPORT との照合: 主張は画像と一致。比較ツールでの画素一致は未測定と正直に記載あり。\n## 動作確認で分かったこと\n今回は撮影画像のみで評価（コード経路が shell.js 中心で、ホームは画像上 c85 と同一）。デモの shell-show と shells=5 は固定入力で決定的に再現されている。\n## 方向性の判断\npolish。質感の磨きは一段進んだが、見た目だけを磨く伸びしろは小さくなった（7が5サイクル続いている）。次は殻に「意味」を持たせる：床の殻に触れると、その演奏が小さな旋律として蘇る。新UIを足さず、触って分かる体験にする。\n## 次に最も効くこと\n1. 水底の殻をタップすると、その殻の元の打（位置・音高）が順に静かに再生され、再生中は対応する部屋が淡く光る。\n2. 殻の部屋に真珠光沢の揺らぎ（ゆっくり動く淡い虹色の帯）を少しだけ。\n3. 殻とワードマーク/バーの重なり回避（床の殻の配置をワードマーク周辺から避ける）。","videos":[],"screens":[{"name":"home","viewport":"desktop","blank":false,"src":"img/c086-desktop-home.jpg"},{"name":"touched","viewport":"desktop","blank":false,"src":"img/c086-desktop-touched.jpg"},{"name":"home","viewport":"mobile","blank":false,"src":"img/c086-mobile-home.jpg"},{"name":"touched","viewport":"mobile","blank":false,"src":"img/c086-mobile-touched.jpg"}]},{"n":87,"pad":"087","mode":"normal","healthy":true,"reasons":[],"errors":[],"score":7,"direction":"polish","summary":"殻に触れると演奏が蘇る。機能は成立だが再生の波紋が大きく賑やかで静けさが薄れた。7点据え置き","logline":"mode=normal | score 7/10 | health=ok | polish | 殻に触れると演奏が蘇る。機能は成立だが再生の波紋が大きく賑やかで静けさが薄れた。7点据え置き","notes":[],"feedback":"# FEEDBACK v87\n## VISION 適合（絶対のルールを守れているか）\n守れている。desktop-home / mobile-home は c86 と同じ静かなホーム（「触れてみてください」＋石＋下部バー）で3秒体験に変化なし。ヘルスOK、コンソールエラー0、新しい常設UI・文字なし。\n## 採点の根拠\n- 良い点: desktop-shell-play で殻が触れられる存在になり、再生中に殻の部屋と波紋が連動して「演奏の記録に触れる」という軸が初めて成立した。shells-floor は desktop・mobile とも殻がワードマーク・石・バーと重ならず、c86 の石との重なり問題も出ていない。desktop-shell-hover は殻の輪郭がごく淡く強まり、ホームの静けさを壊さない。\n- 悪い点: (1) desktop-shell-play の波紋は大きく明るい同心円が画面の左右端まで広がり、REPORT 自身が認める通り「控えめ」になっていない。ORDER の「再生は静かに」に反し、ホーム（石一つの静けさ）との落差が大きい。mobile-shell-play も大きな輪が画面外へはみ出す。(2) 20打で約8秒かかる再生は長く、y が殻 index 由来の仮値で「元の場所で蘇る」になっていない。(3) 殻の質 nd-ring の左上、「響」の周りに四角く角張った暗い影と輪の断片（0〜90px の箱）が出ている。丸い光の中に直線の縁が見え、Apple 水準の仕上げではない。mobile-meet-spark でも「響」が輪に囲まれ、ワードマークが光の的になっている。\n- 悪い点2: mobile-meet-spark の金の輪は濁ったオリーブ／芥子色で、青い画面の中で汚れに見える。desktop-caustic-ring の金は鮮やかなのに、mobile では色が変質している。\n- 悪い点3: 出会いの粒は desktop-meet-spark で左の小さな白い点のみ（輪の交点としては読みにくい）。mobile では輪の上の泡のように見え、「出会い」の意味が伝わらない。REPORT の「粒が見える」は事実だが、体験としては気づかれない。\n- REPORT は概ね正確（金は隅に無し、mobile に弧が残る点も申告どおり）。\n\n## 動作確認で分かったこと\nprobe は使わず、shots の rebound-ring / caustic-ring / meet-spark を desktop・mobile で照合。金の隅ゼロ化は証拠で確認できた。\n\n## 方向性の判断\npolish。伸びてはいないが方向転換の理由は無い。残りサイクルは少ないので、見える欠陥を確実に潰す。\n\n## 次に最も効くこと\n1. 「響」周りの角張った暗い影（ループ光/ワードマークのガラス）の原因を特定し、丸い縁か完全な非表示にする。\n2. mobile の金を濁らせず、鮮やかな金か、思い切って金を出さない。\n3. 出会いの粒を、輪の交点で一瞬だけ小さく明るく読める形に調整（過剰な追加は不要）。","videos":[],"screens":[{"name":"home","viewport":"desktop","blank":false,"src":"img/c097-desktop-home.jpg"},{"name":"touched","viewport":"desktop","blank":false,"src":"img/c097-desktop-touched.jpg"},{"name":"home","viewport":"mobile","blank":false,"src":"img/c097-mobile-home.jpg"},{"name":"touched","viewport":"mobile","blank":false,"src":"img/c097-mobile-touched.jpg"}]},{"n":98,"pad":"098","mode":"normal","healthy":true,"reasons":[],"errors":[],"score":6,"direction":"polish","summary":"「響」の暗い箱は消え mobile も澄んだ。だが desktop の金のちぎれた染みが残る","logline":"mode=normal | score 6/10 | health=ok | polish | 「響」の暗い箱は消え mobile も澄んだ。だが desktop の金のちぎれた染みが残る","notes":[],"feedback":"# FEEDBACK v98\n## VISION 適合\n違反なし（ヘルス OK、エラー 0）。ホームは静かで文字は「触れてみてください」のみ。ただし desktop の金の染みは「Apple 水準の仕上げ」に届かない（desktop-rebound-ring / vessel-full / meet-off）。\n## 採点の根拠\n良い点:\n- c97 の四角い暗い箱は消えた。desktop-rebound-ring・mobile-rebound-ring の左上は文字だけで澄んでいる（vesselRing を角から離した修正が効いた）。\n- mobile の金は完全に消え、オリーブ色も無い。mobile-caustic-ring・meet-spark は青だけで綺麗。\n- desktop-meet-spark の交点の粒（輪の中の白い点）は読める。\n悪い点:\n- desktop-rebound-ring: 右の輪の左に、ギザギザにちぎれた金の塊が浮く（REPORT も既知として認めている）。\n- desktop-vessel-full: 器の周りに金の帯が不規則に割れ、器にまとわりつく。美しいというより染みに見える。\n- desktop-meet-off: 輪の間に金の小さな破片が散る。meet=0 でも金が出ている。\n- mobile-meet-spark: 「響」の脇に輪が 1 つ寄り、光る文字と合わさって的に近い（箱ほどではない）。\n- 前回と点は同じ 6。箱が消えた分は良いが、desktop の金が足を引っ張り続けている。c94 から 5 サイクル、金を「弱める」だけで終わっている。\n## 動作確認で分かったこと\nprobe は使わず、同梱スクショ（home / rebound-ring / meet-spark / meet-off / caustic-ring / vessel-full / loop-cycle、desktop・mobile）で確認。REPORT の「mobile は金なし・箱なし」は一致。「desktop の金は不変」も一致で、その金が問題。\n## 方向性の判断\npolish。伸びてはいないが、土台（水面・波紋・音）は良い。残る減点要因は金の 1 点に絞られている。\n## 次に最も効くこと\n1. desktop でも金を完全にゼロにする（mobile と同じ。青だけの澄んだ水面へ統一）。\n2. 「響」の近くに輪が寄らないよう、小さい画面で輪の中心が左上 160px 内に来ないようにする。\n3. meet の粒を、輪の上の泡ではなく交点の 1 粒として確認する。","videos":[],"screens":[{"name":"home","viewport":"desktop","blank":false,"src":"img/c098-desktop-home.jpg"},{"name":"touched","viewport":"desktop","blank":false,"src":"img/c098-desktop-touched.jpg"},{"name":"home","viewport":"mobile","blank":false,"src":"img/c098-mobile-home.jpg"},{"name":"touched","viewport":"mobile","blank":false,"src":"img/c098-mobile-touched.jpg"}]},{"n":99,"pad":"099","mode":"normal","healthy":true,"reasons":[],"errors":[],"score":7,"direction":"polish","summary":"金の染みが全幅で消え、水面が青だけで澄んだ。輪の質感は美しい。左上の暈が残る","logline":"mode=normal | score 7/10 | health=ok | polish | 金の染みが全幅で消え、水面が青だけで澄んだ。輪の質感は美しい。左上の暈が残る","notes":[],"feedback":"# FEEDBACK v99\n## VISION 適合（絶対のルールを守れているか）\n守れている。ヘルス OK・コンソールエラー 0。ホーム（desktop-home / mobile-home）は静かで、下部の操作はガラス質の1本のピルのみ、「触れてみてください」の一言で3秒以内に触れる。\n## 採点の根拠\n- 良い: c94〜c98 で5サイクル続いた金の染みが、desktop-rebound-ring / vessel-full / meet-spark / mobile-loop-cycle のすべてで消え、青の濃淡だけになった。輪の細い明縁と二重線の質感は c98 のまま保たれている。2 つの輪の交点に meet の粒が見える（desktop-meet-spark の右の輪、mobile-meet-spark）。ホームは不変で破綻なし。\n- 良い: 幽霊の打が「響」から離れた（mobile-loop-cycle で輪の中心が左上 160px の外）。\n- 悪い: desktop-rebound-ring の左上に大きな薄い暈（vesselRing）が残り、「響」の斜め下で汚れに見える。輪が 6 個重なる画面は少し散らかる。\n- 悪い: desktop-caustic-night の画面最上部に赤茶の帯（夜の空の色）が見え、「青だけ」の統一を崩す。\n- REPORT は「夜・loop-cycle は未確認」と正直に書いている。実際に見ると概ね主張どおり。\n## 動作確認で分かったこと\nprobe は使わず、撮影済み 6 画面（desktop 4・mobile 3）を目視。金・琥珀は見当たらない。夜は上端に赤茶の帯が見えた。\n## 方向性の判断\npolish。最大の欠点だった金が解決し、5 サイクル横ばいの 6 から 7 へ。次は発想サイクルで、アプリは動かさない。\n## 次に最も効くこと\n1. 左上の vesselRing の暈を消す、または画面端に寄せない（最終サイクルの通常磨き候補）。\n2. 夜の上端の赤茶の帯を深い青〜墨色に寄せる。\n3. 同時に出る輪の数を抑え、静止画の整理された密度を保つ。","videos":[],"screens":[{"name":"home","viewport":"desktop","blank":false,"src":"img/c099-desktop-home.jpg"},{"name":"touched","viewport":"desktop","blank":false,"src":"img/c099-desktop-touched.jpg"},{"name":"home","viewport":"mobile","blank":false,"src":"img/c099-mobile-home.jpg"},{"name":"touched","viewport":"mobile","blank":false,"src":"img/c099-mobile-touched.jpg"}]},{"n":100,"pad":"100","mode":"innovation","healthy":true,"reasons":[],"errors":[],"score":7,"direction":"polish","summary":"発想サイクルでアプリは不変。ホームは静かで澄み、輪の質感は美しい。上部の暈と石のにじみが残る","logline":"mode=innovation | score 7/10 | health=ok | polish | 発想サイクルでアプリは不変。ホームは静かで澄み、輪の質感は美しい。上部の暈と石のにじみが残る","notes":[],"feedback":"# FEEDBACK v100\n## VISION 適合（絶対のルールを守れているか）\n守れている。desktop-home / mobile-home は文字「触れてみてください」と下部のガラスのピルだけで、何をすべきか分かる。desktop-touched では1タップで青い同心輪が広がる。desktop-meet-spark では3つの輪と光の粒が崩れず描かれ、mobile-touched も輪が画面内に収まる。コンソールエラー0、ヘルスOK。\n## 採点の根拠\n- 良い点: 金の染みは全幅で消えたまま（c99 の成果が維持）。輪は細い縁と淡い内側で塗り円盤にならず、ピルのアイコン・余白・タイポは一貫。mobile でも下部ピルは親指の届く位置で、はみ出しなし。\n- 悪い点: ホーム上部中央〜右に楕円の暈（desktop-home の (800,290) 付近、mobile の (220,300)）が説明のない「しみ」に見える。中央の石は輪郭がにじみ、水面の物体としては少し曖昧。\n- REPORT は提案のみでコード不変と申告、diff.stat も comms のみで一致。点数は c99 から据え置き（新しい証拠なし）。\n## 動作確認で分かったこと\nコード不変のため probe は実施せず、撮影済みの全画面（home/touched/meet-spark 等）の静止画で確認。ヘルス・ビルド・コンソールは meta/ログのとおり良好。\n## 方向性の判断\npolish。直近は 6→7 と上向きで、方向転換の理由がない。\n## 次に最も効くこと\n1. 提案Bの「墨」を縮小実装（既定は水のまま、ホーム画素不変）。反転にしか見えなければ撤退。\n2. ホーム上部の暈を弱める/消す。\n3. 石の輪郭を少し締める。","videos":[],"screens":[{"name":"home","viewport":"desktop","blank":false,"src":"img/c100-desktop-home.jpg"},{"name":"touched","viewport":"desktop","blank":false,"src":"img/c100-desktop-touched.jpg"},{"name":"home","viewport":"mobile","blank":false,"src":"img/c100-mobile-home.jpg"},{"name":"touched","viewport":"mobile","blank":false,"src":"img/c100-mobile-touched.jpg"}]}],"vision":"# VISION\nGENRE: 響 (Hibiki) — 触れた場所が「音」と「光の波紋」になる、水面のような波の楽器（インタラクティブ・アンビエント楽器）\n\n## コンセプト\n画面全体が、暗く深い水面（または光る膜）になっている。指やカーソルで触れると、その場所から本物の波動方程式にもとづく波紋が広がり、\n波同士が干渉し、縁で反射し、光の屈折として美しく描かれる。同時に、触れた位置が音階上の音（横=音高、縦=音色の明るさ）になり、\n残響を伴って鳴る。誰でも間違えようがなく「綺麗で気持ちいい」音楽が作れる、手のひらサイズの瞑想的な楽器。\n新しさ: 音楽ゲームでも描画ツールでもなく、「波の物理」「音」「光」が1つの面で結びついた体験そのものがプロダクトであること。\n長く育てる軸: 世界観（水・墨・絹・砂 など媒質の違い）、ムード（音階・色・残響）、演奏の記録とループ、マイク/傾きなどの入力、作品の保存と書き出し。\nカメラ・マイク・センサーが無くても、デモモード（`?demo=1`、または入力取得失敗時）で「自動演奏する幽霊の指」が主要体験を見せる。\n\n## 絶対のルール\n**UX を最優先し、見た目は Apple 製品のように洗練され、美しいこと。**\n具体的には: 初見の人が説明文なしで、ページを開いてから3秒以内に最初の心地よい体験（1回のタップで光の波紋が広がり、対応する音が返る）に到達でき、\nさらに全画面（デスクトップ幅・スマホ幅の両方）が Apple 製品水準の余白・タイポグラフィ・階層・動き・アイコンの質・一貫性で整っていること。\n雑な見た目、UI の不統一、スマホ幅での崩れ・操作不能、説明が必要な UI は、機能が豊富でも違反とみなす。\n\n## UI 言語\n日本語（ワードマーク「響」のみ漢字1文字。ラベルは短い日本語。英語UIの混在は避ける）\n\n## 評価の観点\n- 初回表示のスクショ: 何をすればよいかが文字なしでも／ごく短い一言で分かるか。画面は空っぽでなく、すでに美しいか（余白・階層・配色）。\n- タップ／ドラッグ後のスクショ: 波紋が滑らかで繊細に描かれているか（ジャギー・ちらつき・白飛びが無いか）。触れた場所から反応しているか。\n- 音: `document.body.dataset.audio` などの状態表示、および Web Audio が起動していることの確認（ヘッドレスでは聞こえないため、状態・コードで確認）。\n- UI クローム: 最小限で、ガラス質・角丸・タイポグラフィ・アイコンが一貫し、Apple 製品のように見えるか。操作できる要素は迷わず触れるか（タップ領域 44px 以上）。\n- スマホ幅 (390×844): 崩れ・はみ出し・セーフエリア干渉が無く、親指で全操作が届くか。\n- デモモード: `?demo=1` で幽霊の指が自動演奏し、静止画でも波紋が見えること。\n- 常時: コンソールエラー無し、真っ白画面無し、60fps 近い滑らかさ（重すぎて固まらない）。\n"}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const C = D.cycles;
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) { if (k == null || k === false) continue; e.append(k.nodeType ? k : document.createTextNode(k)); }
  return e;
}
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem('tl.' + k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem('tl.' + k, JSON.stringify(v)); } catch {} } };
const openNames = new Set(store.get('open', []));
let cur = -1, timer = null;

// ── 左: 文字だけの一覧 ──
const list = document.getElementById('list');
const items = C.map((c, i) => {
  const dirLabel = c.direction === 'pivot' ? '方向転換' : '磨く';
  const el = h('article', { class: 'item', id: 'c' + c.n, onclick: (e) => { if (!e.target.closest('details')) select(i); } },
    h('header', {},
      h('h2', {}, 'cycle ' + c.pad),
      c.mode && h('span', { class: 'b m-' + c.mode }, c.mode),
      c.healthy != null && (c.healthy ? h('span', { class: 'b ok' }, '健全') : h('span', { class: 'b ng', title: c.reasons.join(' / ') }, 'NG')),
      c.direction && h('span', { class: 'b dir-' + c.direction }, dirLabel),
      c.score != null ? h('span', { class: 'score' }, String(c.score), h('small', {}, '/10')) : h('span', { class: 'score muted' }, '–')),
    h('p', { class: 'summary' }, c.summary),
    c.notes.length > 0 && h('ul', { class: 'notes' }, c.notes.map((t) => h('li', {}, '⚙ ' + t))),
    c.n === 0 && h('details', {}, h('summary', {}, 'VISION'), h('pre', {}, D.vision)),
    c.feedback && h('details', {}, h('summary', {}, '評価の全文'), h('pre', {}, c.feedback)),
    c.errors.length > 0 && h('details', {}, h('summary', {}, 'コンソールエラー ' + c.errors.length + ' 件'), h('pre', {}, c.errors.join('\n'))));
  list.append(el);
  return el;
});

// ── 右: 画像ビューア ──
const viewer = document.getElementById('viewer');
function loadImgs(root) { root.querySelectorAll('img[data-src]').forEach((im) => { im.src = im.dataset.src; im.removeAttribute('data-src'); }); }
function renderViewer() {
  const c = C[cur];
  viewer.replaceChildren();
  const prevBtn = h('button', { onclick: () => step(-1), title: '前のサイクル (←)' }, '◀');
  const nextBtn = h('button', { onclick: () => step(1), title: '次のサイクル (→)' }, '▶');
  const play = h('button', { id: 'play', class: timer ? 'on' : '', onclick: togglePlay }, timer ? '■ 停止' : '▶ 再生');
  const speed = h('select', { id: 'speed', onchange: () => { store.set('speed', speed.value); if (timer) { stopPlay(); startPlay(); } } },
    [['2200', 'ゆっくり'], ['1100', '普通'], ['500', '速い'], ['250', '最速']].map(([v, t]) => h('option', { value: v }, t)));
  speed.value = store.get('speed', '1100');
  viewer.append(h('div', { class: 'vhead' }, h('h3', {}, 'cycle ' + c.pad), c.score != null && h('span', { class: 'score' }, String(c.score), h('small', {}, '/10')),
    h('div', { class: 'tools' }, prevBtn, nextBtn, play, speed,
      hasVideos && h('button', { id: 'vplay', class: vmode ? 'on' : '', onclick: toggleVideoPlay, title: '各サイクルの demo 動画を順に連続再生' }, vmode ? '■ 動画停止' : '🎬 動画再生'),
      h('span', { class: 'sp' }),
      h('button', { onclick: () => toggleAll(true) }, '全て開く'), h('button', { onclick: () => toggleAll(false) }, '全て閉じる'))));
  if (c.videos.length) {
    const vopen = vmode || openNames.has('動画');
    const vdet = h('details', { class: 'acc', 'data-name': '動画', open: vopen },
      h('summary', {}, '動画（demo）', h('small', {}, c.videos.map((v) => v.viewport + ' ' + v.sec + 's').join(' · '))),
      h('div', { class: 'shots' }, c.videos.map((v) => {
        const vid = h('video', { controls: true, playsinline: true, loop: !vmode, preload: 'metadata', 'data-vsrc': v.src });
        vid.muted = true;
        if (vmode) vid.addEventListener('ended', () => { const j = nextVideoIdx(cur); if (j < 0) { vmode = false; renderViewer(); } else select(j, { scroll: true }); });
        return h('figure', { class: v.viewport }, vid, h('figcaption', {}, v.viewport));
      })));
    const loadVideos = () => vdet.querySelectorAll('video[data-vsrc]').forEach((vd) => { vd.src = vd.dataset.vsrc; vd.removeAttribute('data-vsrc'); if (vmode || vdet.dataset.play) vd.play().catch(() => {}); });
    vdet.addEventListener('toggle', () => { if (vdet.open) { openNames.add('動画'); vdet.dataset.play = '1'; loadVideos(); } else openNames.delete('動画'); store.set('open', [...openNames]); });
    viewer.append(vdet);
    if (vopen) loadVideos();
  }
  const names = [...new Set(c.screens.map((s) => s.name))];
  if (!names.length) { if (!c.videos.length) viewer.append(h('p', { class: 'empty' }, c.n === 0 ? 'cycle 0 はアプリが空のためスクショはありません。' : 'このサイクルにはスクショがありません。')); return; }
  const anyOpen = names.some((n) => openNames.has(n));
  names.forEach((name, i) => {
    const shots = c.screens.filter((s) => s.name === name);
    const open = openNames.has(name) || (!anyOpen && i === 0);
    const det = h('details', { class: 'acc', 'data-name': name, open },
      h('summary', {}, name, h('small', {}, shots.map((s) => s.viewport).join(' · '))),
      h('div', { class: 'shots' }, shots.map((s) => h('figure', { class: s.viewport + (s.blank ? ' blank' : '') },
        h('img', { 'data-src': s.src, alt: 'cycle ' + c.n + ' ' + name + ' ' + s.viewport, 'data-full': true }), h('figcaption', {}, s.viewport + (s.blank ? '（真っ白）' : ''))))));
    det.addEventListener('toggle', () => {
      if (det.open) { openNames.add(name); loadImgs(det); } else openNames.delete(name);
      store.set('open', [...openNames]);
    });
    viewer.append(det);
    if (open) loadImgs(det);
  });
}
function toggleAll(on) { viewer.querySelectorAll('details.acc').forEach((d) => { d.open = on; }); }

// ── 選択・再生 ──
function select(i, { scroll = false } = {}) {
  if (i < 0 || i >= C.length || i === cur) return;
  cur = i;
  items.forEach((el, k) => el.classList.toggle('sel', k === i));
  document.querySelectorAll('.dot').forEach((d) => d.classList.toggle('cur', Number(d.dataset.n) === C[i].n));
  if (scroll) items[i].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  history.replaceState(null, '', '#c' + C[i].n);
  renderViewer();
}
function step(d) { select(Math.min(C.length - 1, Math.max(0, cur + d)), { scroll: true }); }
const hasVideos = C.some((c) => c.videos.length);
let vmode = false;
function nextVideoIdx(from) { for (let i = from + 1; i < C.length; i++) if (C[i].videos.length) return i; return -1; }
function toggleVideoPlay() {
  if (vmode) { vmode = false; renderViewer(); return; }
  stopPlay(); vmode = true;
  const j = C[cur].videos.length && nextVideoIdx(cur) >= 0 ? cur : C.findIndex((c) => c.videos.length);
  if (j !== cur) select(j, { scroll: true }); else renderViewer();
}
function startPlay() {
  if (timer) return;
  vmode = false;
  if (cur >= C.length - 1) select(C.findIndex((c) => c.screens.length) , { scroll: true });
  timer = setInterval(() => { if (cur >= C.length - 1) { stopPlay(); renderPlayBtn(); return; } step(1); }, Number(store.get('speed', '1100')));
  renderPlayBtn();
}
function stopPlay() { clearInterval(timer); timer = null; }
function togglePlay() { timer ? (stopPlay(), renderPlayBtn()) : startPlay(); }
function renderPlayBtn() { const b = document.getElementById('play'); if (b) { b.textContent = timer ? '■ 停止' : '▶ 再生'; b.classList.toggle('on', !!timer); } }

document.addEventListener('keydown', (e) => {
  if (e.target.matches('select,input')) return;
  if (e.key === 'Escape') document.getElementById('lb').classList.remove('on');
  else if (e.key === 'ArrowRight' || e.key === 'j') { e.preventDefault(); step(1); }
  else if (e.key === 'ArrowLeft' || e.key === 'k') { e.preventDefault(); step(-1); }
  else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
});
const lb = document.getElementById('lb'), lbImg = lb.querySelector('img');
document.addEventListener('click', (e) => {
  const t = e.target;
  if (t.matches && t.matches('img[data-full]')) { lbImg.src = t.src; lb.classList.add('on'); }
  else if (lb.contains(t) || t === lb) lb.classList.remove('on');
  else if (t.closest && t.closest('.chartbox a')) { const n = Number(t.closest('a').getAttribute('href').slice(2)); const i = C.findIndex((c) => c.n === n); if (i >= 0) { e.preventDefault(); select(i, { scroll: true }); } }
});
const fromHash = () => { const m = location.hash.match(/^#c(\d+)$/); return m ? C.findIndex((c) => c.n === Number(m[1])) : -1; };
window.addEventListener('hashchange', () => { const i = fromHash(); if (i >= 0) select(i, { scroll: true }); });
const start = fromHash();
const lastShot = C.map((c) => c.screens.length > 0).lastIndexOf(true);
select(start >= 0 ? start : Math.max(0, lastShot), { scroll: start >= 0 });
</script></body></html>
